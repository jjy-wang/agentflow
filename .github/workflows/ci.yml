name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    name: mvn verify (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译 + 单测 + 集成测试 + ArchUnit + JaCoCo 门槛
        run: mvn -B verify

      - name: 上传 JaCoCo 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  k6-smoke:
    name: k6 smoke（baseline）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建应用与 mock-llm
        run: |
          mvn -B -q clean package -DskipTests
          mvn -B -q -f mock-llm/pom.xml clean package -DskipTests

      - name: 启动依赖中间件
        run: docker compose up -d postgres redis rabbitmq

      - name: 启动 mock-llm
        run: |
          nohup java -jar mock-llm/target/mock-llm-*.jar --server.port=9000 > mock-llm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && break || sleep 2
          done

      - name: 启动应用
        run: |
          nohup java -jar target/agentflow-*.jar \
            --spring.profiles.active=local \
            --DB_HOST=localhost --REDIS_HOST=localhost --MQ_HOST=localhost \
            > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break || sleep 2
          done
        env:
          DB_HOST: localhost
          REDIS_HOST: localhost
          MQ_HOST: localhost
          LLM_MOCK_BASE_URL: http://localhost:9000

      - name: 安装 k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: k6 baseline 冒烟（缩时版）
        run: k6 run --vus 10 --duration 30s loadtest/baseline.js
